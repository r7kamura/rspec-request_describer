name: test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  rspec:
    runs-on: ubuntu-latest
    name: rspec (Ruby ${{ matrix.ruby }})
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.3', '3.4', '4.0']
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ruby/setup-ruby@v1.336.0
        with:
          bundler-cache: true
          ruby-version: ${{ matrix.ruby }}
      - run: bundle exec rspec
  rubocop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1.336.0
        with:
          bundler-cache: true
          ruby-version: '3.3'
      - run: bundle exec rubocop --parallel --format progress --format github
